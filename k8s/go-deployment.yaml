apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-inventory
  namespace: ecommerce-poc
  labels:
    app: go-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-inventory
  template:
    metadata:
      labels:
        app: go-inventory
    spec:
      containers:
      - name: go-inventory
        image: 683031685817.dkr.ecr.ap-southeast-1.amazonaws.com/ecommerce-go-inventory:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: go-inventory
  namespace: ecommerce-poc
  labels:
    app: go-inventory
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: go-inventory
