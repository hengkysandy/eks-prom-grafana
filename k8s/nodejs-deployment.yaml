apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: ecommerce-poc
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /tmp/positions.yaml
    
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    
    scrape_configs:
      - job_name: pod-logs
        docker_sd_configs:
          - host: unix:///var/run/docker.sock
            refresh_interval: 5s
        relabel_configs:
          - source_labels: ['__meta_docker_container_name']
            regex: '/(.*)'
            target_label: 'container'
          - source_labels: ['__meta_docker_container_log_stream']
            target_label: 'stream'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-catalog
  namespace: ecommerce-poc
  labels:
    app: nodejs-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-catalog
  template:
    metadata:
      labels:
        app: nodejs-catalog
    spec:
      shareProcessNamespace: true
      containers:
      - name: nodejs-catalog
        image: 683031685817.dkr.ecr.ap-southeast-1.amazonaws.com/ecommerce-nodejs-catalog:latest
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
      
      - name: promtail
        image: grafana/promtail:2.9.3
        args:
          - -config.file=/etc/promtail/promtail.yaml
          - -config.expand-env=true
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      
      volumes:
      - name: promtail-config
        configMap:
          name: promtail-config
      - name: varlog
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-catalog
  namespace: ecommerce-poc
  labels:
    app: nodejs-catalog
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: nodejs-catalog
