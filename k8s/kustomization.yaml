apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespaces
  - namespace.yaml
  
  # Storage
  - storage-class.yaml
  
  # Application deployments
  - nodejs-deployment.yaml
  - python-deployment.yaml
  - go-deployment.yaml
  - traffic-generator.yaml
  
  # Monitoring stack
  - prometheus/prometheus-deployment.yaml
  - prometheus/kube-state-metrics.yaml
  - prometheus/node-exporter.yaml
  - prometheus/alertmanager.yaml
  - prometheus/alert-rules.yaml
  - grafana/grafana-deployment.yaml
  - loki/loki-deployment.yaml
  - loki/promtail-daemonset.yaml
  - tempo/tempo-deployment.yaml
