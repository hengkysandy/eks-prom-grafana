apiVersion: v1
kind: ServiceAccount
metadata:
  name: amp-iamproxy-ingest
  namespace: monitoring
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::683031685817:role/ecommerce-poc-amp-ingest-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: ecommerce-poc-eks
    
    remote_write:
      - url: http://localhost:8005/workspaces/ws-0add6a78-6f0f-4adc-8e17-7c05be26eb5b/api/v1/remote_write
        queue_config:
          max_samples_per_send: 1000
          max_shards: 200
          capacity: 2500
    
    scrape_configs:
      - job_name: 'nodejs-catalog'
        static_configs:
          - targets: ['nodejs-catalog.ecommerce-poc.svc.cluster.local:3000']
      
      - job_name: 'python-orders'
        static_configs:
          - targets: ['python-orders.ecommerce-poc.svc.cluster.local:5000']
      
      - job_name: 'go-inventory'
        static_configs:
          - targets: ['go-inventory.ecommerce-poc.svc.cluster.local:8080']
      
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: amp-iamproxy-ingest
      containers:
      - name: prometheus
        image: prom/prometheus:v2.48.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=1h'
          - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
      
      - name: aws-sigv4-proxy
        image: public.ecr.aws/aws-observability/aws-sigv4-proxy:1.0
        args:
          - --name
          - aps
          - --region
          - ap-southeast-1
          - --host
          - aps-workspaces.ap-southeast-1.amazonaws.com
          - --port
          - :8005
        ports:
        - containerPort: 8005
          name: aws-sigv4-proxy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  selector:
    app: prometheus
