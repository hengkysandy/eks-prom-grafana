# Example secrets - DO NOT use in production
# Create actual secrets using: kubectl create secret generic <name> --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce-poc
type: Opaque
stringData:
  DATABASE_URL: "sqlite:///data/app.db"
  API_KEY: "REPLACE_WITH_ACTUAL_KEY"
  JWT_SECRET: "REPLACE_WITH_ACTUAL_SECRET"
